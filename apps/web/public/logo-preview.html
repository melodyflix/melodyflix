<!DOCTYPE html>
<html>
<head><title>MelodyFlix Logo Preview</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  .row { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .dark { background: #0a0a0f; color: white; }
  .light { background: #fafafa; color: black; }
  .stack { display: flex; flex-direction: column; gap: 40px; align-items: center; padding: 60px; }
</style>
</head>
<body>
  <div class="dark">
    <div class="stack">
      <img src="/logo.svg" width="128" height="128" alt="MelodyFlix logo">
      <div style="font-size: 64px; font-weight: 800; letter-spacing: -1px;">
        Melody<span style="background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Flix</span>
      </div>
      <div style="font-size: 14px; font-weight: 600; letter-spacing: 4px; color: #a1a1aa;">
        CINEMA &middot; DRAMA &middot; MUSIC
      </div>
    </div>
  </div>
</body>
</html>
