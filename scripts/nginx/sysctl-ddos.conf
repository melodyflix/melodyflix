# melodyflix — Kernel-level DDoS hardening
# Install to: /etc/sysctl.d/99-melodyflix-ddos.conf
# Apply with: sudo sysctl -p /etc/sysctl.d/99-melodyflix-ddos.conf
#
# Notes:
#  - Tested on Ubuntu 22.04 / 24.04.
#  - On proot/Termux these may fail silently — they apply on real VPS.

# --- SYN flood protection ---
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_max_syn_backlog = 8192

# --- Connection table protection ---
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 262144
net.ipv4.tcp_max_orphans = 65536
net.ipv4.ip_local_port_range = 10240 65000

# --- ICMP flood ---
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.icmp_ratelimit = 100
net.ipv4.icmp_ratemask = 88089

# --- IP spoofing protection ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# --- Backlog / connection backlog ---
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 8192
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# --- File descriptor limits (mirror in systemd/ulimit) ---
fs.file-max = 1000000
fs.inotify.max_user_watches = 524288

# --- IPv6 hardening ---
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
