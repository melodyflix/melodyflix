# melodyflix - frontend + API reverse proxy

RewriteEngine On

# --- API proxy to backend services ---

# Auth (4001)
RewriteRule ^api/v1/auth/(.*)$ http://127.0.0.1:4001/api/v1/auth/$1 [P,L]

# Channels (4002)
RewriteRule ^api/v1/channels/(.*)$ http://127.0.0.1:4002/api/v1/channels/$1 [P,L]

# Videos + everything else (4003) — biggest service
RewriteRule ^api/v1/videos/(.*)$ http://127.0.0.1:4003/api/v1/videos/$1 [P,L]
RewriteRule ^api/v1/admin/(.*)$ http://127.0.0.1:4003/api/v1/admin/$1 [P,L]

# Notifications (4004)
RewriteRule ^api/v1/notifications/(.*)$ http://127.0.0.1:4004/api/v1/notifications/$1 [P,L]

# Live (4005)
RewriteRule ^api/v1/live/(.*)$ http://127.0.0.1:4005/api/v1/live/$1 [P,L]

# Live WebSocket
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^ws-live/(.*)$ ws://127.0.0.1:4005/ws/$1 [P,L]

# --- SPA fallback for React Router ---
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{REQUEST_URI} !^/api/
RewriteRule . /index.html [L]

# --- Security headers ---
<IfModule mod_headers.c>
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# --- Compression ---
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
</IfModule>

# --- Cache static assets ---
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/svg+xml "access plus 1 month"
  ExpiresByType image/png "access plus 1 month"
  ExpiresByType text/css "access plus 1 week"
  ExpiresByType application/javascript "access plus 1 week"
</IfModule>

# --- Uploads (user files) ---
php_value upload_max_filesize 2G
php_value post_max_size 2G
