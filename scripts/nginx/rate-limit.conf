# melodyflix — Nginx rate limiting zones
# Install to: /etc/nginx/snippets/melodyflix-ratelimit.conf
#
# Zones:
#   auth_limit    — login/signup/password-reset (strict)
#   api_limit     — general API endpoints
#   upload_limit  — video uploads (slow, huge bodies)
#   perip_limit   — global per-IP concurrent connections

# --- Rate zones (must be in http{} context) ---
# 5 requests per minute for sensitive auth endpoints (burst 3)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 100 requests per second for general API (burst 50)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# 10 uploads per hour (burst 3)
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/h;

# Whitelist localhost + private networks from rate limits
geo $limit_exempt {
    default 0;
    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

# --- Concurrent connection limit ---
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

# Custom status for rate-limited requests
limit_req_status 429;
limit_conn_status 429;
