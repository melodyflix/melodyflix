# melodyflix — Nginx security headers + attack blocking
# Install to: /etc/nginx/snippets/melodyflix-security.conf

# --- Security headers ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS — enable only after HTTPS is working (B2)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy — tune for production (start permissive)
# add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: wss:;" always;

# --- Block common attack patterns (returns 404 fast) ---
location ~* /\.(env|git|svn|htaccess|htpasswd|yml|yaml)$ {
    return 404;
}
location ~* /(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|adminer\.php) {
    return 404;
}
location ~* /vendor/|/node_modules/|\.sql$|\.bak$|\.log$ {
    return 404;
}

# Block common exploit files
location ~* /(config|credentials|secrets)\.(php|asp|jsp|py|rb|json)$ {
    return 404;
}
