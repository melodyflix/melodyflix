# melodyflix - Nginx HTTPS config template
# Reference for fresh deploys. Certbot modifies the live config automatically
# when you run: sudo bash scripts/setup-ssl.sh <domain> [admin-domain]
#
# Modern TLS config (TLSv1.2 + TLSv1.3, HSTS, OCSP stapling, session cache).

# --- Web server (HTTPS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name melodyflix.com www.melodyflix.com;

    ssl_certificate /etc/letsencrypt/live/melodyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melodyflix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS - enable only after confirming HTTPS works
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ... root, locations, proxy_pass blocks (inherit from HTTP config)
}

# --- Admin (HTTPS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.melodyflix.com;

    ssl_certificate /etc/letsencrypt/live/admin.melodyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.melodyflix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ... admin root, locations, proxy_pass blocks
}

# --- Redirect HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name melodyflix.com www.melodyflix.com admin.melodyflix.com;
    return 301 https://$host$request_uri;
}
