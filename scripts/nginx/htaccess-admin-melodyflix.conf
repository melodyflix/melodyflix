# BEGIN cPanel-generated php ini directives
<IfModule php8_module>
   php_value error_log "/home/melodyfl/logs/php.error.log"
   php_flag log_errors On
</IfModule>
<IfModule lsapi_module>
   php_value error_log "/home/melodyfl/logs/php.error.log"
   php_flag log_errors On
</IfModule>
# END cPanel-generated php ini directives

# melodyflix admin - SPA + API proxy
RewriteEngine On

# Health endpoints
RewriteRule ^api/auth/health$ http://127.0.0.1:4001/health [P,L]
RewriteRule ^api/channels/health$ http://127.0.0.1:4002/health [P,L]
RewriteRule ^api/videos/health$ http://127.0.0.1:4003/health [P,L]
RewriteRule ^api/live/health$ http://127.0.0.1:4005/health [P,L]
RewriteRule ^api/notifications/health$ http://127.0.0.1:4004/health [P,L]

# Old /api/auth/* path mapping (frontend still uses this)
RewriteRule ^api/auth/(.*)$ http://127.0.0.1:4001/api/v1/auth/$1 [P,L]

# v1 API proxy
RewriteRule ^api/v1/auth/admin/(.*)$ http://127.0.0.1:4001/api/v1/admin/$1 [P,L]
RewriteRule ^api/v1/auth/(.*)$ http://127.0.0.1:4001/api/v1/auth/$1 [P,L]
RewriteRule ^api/v1/channels/admin/(.*)$ http://127.0.0.1:4002/api/v1/channels/admin/$1 [P,L]
RewriteRule ^api/v1/channels$ http://127.0.0.1:4002/api/v1/channels [P,L,QSA]
RewriteRule ^api/v1/channels/(.*)$ http://127.0.0.1:4002/api/v1/channels/$1 [P,L]
RewriteRule ^api/channels/(.*)$ http://127.0.0.1:4002/api/v1/channels/$1 [P,L]
RewriteRule ^api/channels$ http://127.0.0.1:4002/api/v1/channels [P,L]
RewriteRule ^api/admin/(.*)$ http://127.0.0.1:4003/api/v1/videos/admin/$1 [P,L]
RewriteRule ^api/videos/(.*)$ http://127.0.0.1:4003/api/v1/videos/$1 [P,L]
RewriteRule ^api/notifications/(.*)$ http://127.0.0.1:4004/api/v1/notifications/$1 [P,L]
RewriteRule ^api/live/(.*)$ http://127.0.0.1:4005/api/v1/live/$1 [P,L]

# v1 API proxy to backend services
RewriteRule ^api/v1/auth/(.*)$ http://127.0.0.1:4001/api/v1/auth/$1 [P,L]
RewriteRule ^api/v1/channels/(.*)$ http://127.0.0.1:4002/api/v1/channels/$1 [P,L]
RewriteRule ^api/v1/videos$ http://127.0.0.1:4003/api/v1/videos [P,L,QSA]
RewriteRule ^api/v1/videos/(.*)$ http://127.0.0.1:4003/api/v1/videos/$1 [P,L]
RewriteRule ^api/v1/admin/(.*)$ http://127.0.0.1:4003/api/v1/admin/$1 [P,L]
RewriteRule ^api/v1/notifications/(.*)$ http://127.0.0.1:4004/api/v1/notifications/$1 [P,L]
RewriteRule ^api/v1/live/(.*)$ http://127.0.0.1:4005/api/v1/live/$1 [P,L]

# SPA fallback for React Router
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{REQUEST_URI} !^/api/
RewriteRule . /index.html [L]

# Security headers
<IfModule mod_headers.c>
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
