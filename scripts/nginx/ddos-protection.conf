# melodyflix — Nginx DDoS protection & hardening
# Install to: /etc/nginx/snippets/melodyflix-ddos.conf
#
# Two contexts:
#   (A) http{}    — maps, zones, timeouts
#   (B) server{}  — enforcement (see §7 below)
#
# Include from nginx.conf:
#   http {
#     include snippets/melodyflix-ddos.conf;
#   }
# Inside each server{} block, add enforcement (see bottom of this file).

# ============================================================
# 1. BAD USER-AGENT BLOCKLIST
# ============================================================
map $http_user_agent $bad_ua {
    default 0;
    "" 1;                          # empty UA → suspicious
    ~*python-requests 1;
    ~*libwww-perl 1;
    ~*wget 1;
    ~*Go-http-client 1;
    ~*masscan 1;
    ~*nmap 1;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*acunetix 1;
    ~*havij 1;
    ~*zgrab 1;
    ~*semrush 1;
    ~*ahrefs 1;
    ~*mj12bot 1;
    ~*dotbot 1;
    ~*petalbot 1;
    ~*bytespider 1;
    ~*scrapy 1;
    ~*mechanize 1;
    ~*headlesschrome 1;
    ~*phantomjs 1;
}

# ============================================================
# 2. REQUEST METHOD WHITELIST
# ============================================================
map $request_method $bad_method {
    default 1;                     # reject by default
    GET 0;
    HEAD 0;
    POST 0;
    PUT 0;
    PATCH 0;
    DELETE 0;
    OPTIONS 0;
}

# ============================================================
# 3. STATIC IP BLOCKLIST
# ============================================================
# Generate this file from /api/v1/ip-blocks and include it here.
# Reload nginx when the list changes.
geo $blocked_ip {
    default 0;
    # Include auto-generated list below (uncomment when file exists):
    # include /etc/nginx/snippets/melodyflix-blocked-ips.conf;
}

# ============================================================
# 4. SUSPICIOUS QUERY STRING PATTERNS
# ============================================================
map $query_string $bad_query {
    default 0;
    ~*(\.\./|%2e%2e|\.%2e|%2e\.)           1;   # path traversal
    ~*(<script|%3cscript|%3c%2fscript)     1;   # XSS
    ~*(union.*select|select.*from|concat\() 1;  # SQLi
    ~*(/etc/passwd|/proc/self|/root/)      1;   # LFI
    ~*(eval\(|base64_decode|system\()      1;   # RCE
    ~*(\bexec\b|\bshell_exec\b|passthru)   1;
}

# ============================================================
# 5. CONNECTION & REQUEST-RATE ZONES
# ============================================================
# Concurrent connections per source IP
limit_conn_zone $binary_remote_addr zone=perip_ddos:10m;
# Concurrent connections per server (name)
limit_conn_zone $server_name zone=perserver_ddos:10m;
# Slowloris protection: bound request rate per IP on the whole vhost
limit_req_zone $binary_remote_addr zone=slowreq_ddos:10m rate=10r/s;
# Host-header flood protection
limit_req_zone $binary_remote_addr zone=hostflood:10m rate=30r/s;

# ============================================================
# 6. TIMEOUT & BUFFER HARDENING (global — http{})
# ============================================================
# Slowloris + slow-body protection
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 10s;
keepalive_timeout 15s;
reset_timedout_connection on;
keepalive_requests 100;

# Body & header buffer limits (defensive defaults)
client_body_buffer_size 128k;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;
client_max_body_size 10m;              # override per-location for uploads

# Rate-limit HTTP status
limit_req_status 429;
limit_conn_status 429;

# ============================================================
# 7. ENFORCEMENT — COPY INTO server{} BLOCKS
# ============================================================
# Paste this block inside every server{} (main vhost, admin, api):
#
#   # --- DDoS enforcement ---
#   if ($bad_ua)       { return 403; }
#   if ($bad_method)   { return 405; }
#   if ($blocked_ip)   { return 403; }
#   if ($bad_query)    { return 400; }
#
#   limit_conn perip_ddos 50;             # max 50 conn per IP
#   limit_conn perserver_ddos 1000;       # max 1000 conn per vhost
#   limit_req  zone=slowreq_ddos burst=20 nodelay;
#   limit_req  zone=hostflood    burst=60 nodelay;
#
# For upload-heavy locations, override:
#
#   location /api/v1/videos/upload {
#     client_max_body_size 2g;
#     client_body_timeout 300s;
#     limit_conn perip_ddos 5;
#     # skip slowreq here so legit slow uploads aren't throttled
#   }
#
# For auth-sensitive locations, layer stricter rules:
#
#   location /api/v1/auth/ {
#     limit_req zone=auth_limit burst=3 nodelay;   # from rate-limit.conf
#   }
